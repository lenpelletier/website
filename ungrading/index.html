<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ungrading Resources</title>
    <style>
        body {
            /* Pink Background */
            background-color: #E91E63;
            /* White Text */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            /* Slight shadow to ensure white text pops against pink */
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .container {
            width: 80%;
            max-width: 600px;
        }

        a {
            display: block;
            /* White Text */
            color: white;
            text-decoration: none;
            border: 2px solid white;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Light Blue Highlight on Hover */
        a:hover {
            background-color: #00BFFF;
            border-color: #00BFFF;
            color: #333; /* Darker text on hover for readability */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ungrading Resources</h1>

        <a href="HRP-UngradingHandbook2022_V1.0.pdf" target="_blank" download>
            HRP Ungrading Handbook 2022
        </a>

        <a href="Prebe_ ungrading handout for department .pdf" target="_blank" download>
            Prebe Ungrading Handout for Department
        </a>

        <a href="Ungrading-Supporting-Our-Students-through-a-Pedagogy-of-Care-.pdf" target="_blank" download>
            Ungrading: Supporting Our Students through a Pedagogy of Care
        </a>

        <a href="Ungrading-Untangling-Grades-from-Feedback.pdf" target="_blank" download>
            Ungrading: Untangling Grades from Feedback
        </a>

        <a href="Ungrading-quick-start-sources-Blum.pdf" target="_blank" download>
            Ungrading Quick Start Sources (Blum)
        </a>
    </div>

</body>
</html>
