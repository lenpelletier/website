<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>extraEnd Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Victor+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tracer.css">
</head>
<body>
<main>
  <h1>extraEnd: three copies of the end</h1>
  <p class="sub">Given a string, return a new string made of 3 copies of its last 2 characters. The string length will be at least 2. Step through <code>extraEnd</code>: <code>str.length()-2</code> is the index where the last two characters start, and <code>substring</code> with one number goes from there to the end.</p>
  <div id="app"></div>
</main>
<script src="tracer.js"></script>
<script>
Tracer({
  name: "extraEnd",
  code: [
    "public String extraEnd(String str) {",
    "  String end = str.substring(str.length()-2);",
    "  return end + end + end;",
    "}"
  ],
  inputs: [{ id: "str", value: "Hello" }],
  chk: false,
  presets: [["Hello"], ["ab"], ["Hi"], ["Candy"], ["Code"]],
  validate([str]) {
    if (str.length < 2) return `<code>str</code> needs at least 2 characters — <code>str.length()-2</code> would be negative and <code>substring</code> would throw an exception.`;
  },
  legend: [
    ["outer", "<code>end</code> = <code>str.substring(str.length()-2)</code>"],
    ["inner", "copies of <code>end</code>"]
  ],
  trace([str], T) {
    const q = T.q, n = str.length, end = str.substring(n - 2), ans = end + end + end;
    let stage = 0;
    T.view = () => {
      const s = T.strip("str", str), list = [s];
      if (stage >= 1) { s.cut(n - 2, n, "win"); list.push(T.strip("end", end).cls(0, 2, stage === 1 ? "win new" : "win")); }
      if (stage >= 2) list.push(T.cat(`end + end + end = ${JSON.stringify(ans)}`, [[end, "win2"], [end, ""], [end, "win2"]]).top(0, "1st", "inner").top(2, "2nd", "muted").top(4, "3rd", "inner"));
      return list;
    };
    T.vars.str = str;
    T.push(0, `Call <code>extraEnd(${q(str)})</code>.`);
    stage = 1; T.vars.end = end;
    T.push(1, `<code>str.length()-2</code> is <code>${n}-2</code> → <code>${n - 2}</code>. <code>str.substring(${n - 2})</code> goes from index ${n - 2} to the end → <code>end = ${q(end)}</code>.`);
    stage = 2;
    T.ret(2, `<code>end + end + end</code> → <code>${q(ans)}</code>.`, ans);
  }
});
</script>
</body>
</html>
