<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twoTwo Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Victor+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tracer.css">
</head>
<body>
<main>
  <h1>twoTwo: is every 2 next to another 2?</h1>
  <p class="sub">Given an array of ints, return true if every 2 that appears is next to another 2. Step through <code>twoTwo</code>: when the <code>for</code> loop lands on a 2, the inner <code>while</code> loop walks along the whole run of 2s, counting them. A run of just one 2 means a lonely 2.</p>
  <div id="app"></div>
</main>
<script src="tracer.js"></script>
<script>
Tracer({
  name: "twoTwo",
  code: [
    "public boolean twoTwo(int[] nums) {",
    "  for (int i = 0; i < nums.length; i++){",
    "      int count2 = 0;",
    "      while (i < nums.length && nums[i] == 2) {",
    "        count2++;",
    "        i++;",
    "      }",
    "      if (count2 == 1) return false;",
    "",
    "  }",
    "  return true;",
    "}"
  ],
  inputs: [{ id: "nums", kind: "array", value: [4, 2, 2, 3, 2], width: 240 }],
  presets: [[[4, 2, 2, 3]], [[2, 2, 4]], [[2, 2, 4, 2]], [[1, 3, 4]], [[1, 2, 2, 3, 4]], [[1, 2, 3, 4]], [[2, 2]], [[2, 2, 7]], [[2, 2, 7, 2, 1]], [[4, 2, 2, 2]], [[2, 2, 2]], [[1, 2]], [[2]], [[1]], [[]], [[5, 2, 2, 3]]],
  legend: [
    ["outer", "<code>nums[i]</code>"],
    ["match", "in a run of 2s"],
    ["bad", "a lonely 2"]
  ],
  trace([nums], T) {
    const n = nums.length;
    let i = null, runs = [], lonely = null, inWhile = false;
    T.view = () => {
      const A = T.arr("nums", nums);
      runs.forEach(k => A.at(k, "hit"));
      if (lonely !== null) A.at(lonely, "miss");
      if (i !== null) { A.top(i, `i=${i} ▼`); if (i < n) A.at(i, "outer"); }
      return [A];
    };
    T.vars.nums = nums;
    T.push(0, `Call <code>twoTwo(${T.fmt(nums)})</code>.`);
    for (i = 0; ; i++) {
      T.vars.i = i; delete T.vars.count2;
      if (i >= n) { T.push(1, `<code>i = ${i}</code>: <code>${i} &lt; ${n}</code> is <b>false</b>, so the loop ends.`); break; }
      T.push(1, `${i === 0 ? "Loop starts at" : "Loop:"} <code>i = ${i}</code>. <code>${i} &lt; ${n}</code> is <b>true</b>.`);
      let c = 0; T.vars.count2 = 0;
      T.push(2, `<code>count2 = 0</code>. It's declared inside the loop, so it starts fresh on every pass.`);
      const start = i;
      for (;;) {
        const inside = i < n, two = inside && nums[i] === 2;
        const chk = [["i &lt; nums.length", `${i} < ${n} → ${inside}`, inside], ["nums[i] == 2", inside ? `${nums[i]} == 2 → ${two}` : "(skipped)", inside ? two : undefined]];
        if (!two) {
          T.push(3, !inside ? `<code>i</code> has reached the end of the array, so the <code>while</code> stops. (Checking <code>i &lt; nums.length</code> first keeps <code>nums[i]</code> from going past the end.)` : c ? `<code>nums[${i}]</code> is ${nums[i]}, so the run of 2s is over.` : `<code>nums[${i}]</code> is ${nums[i]}, not 2, so the <code>while</code> loop doesn't run.`, { chk, in: true });
          break;
        }
        T.push(3, `<code>nums[${i}]</code> is a 2, so the <code>while</code> loop runs.`, { chk, in: true });
        c++; T.vars.count2 = c;
        T.push(4, `<code>count2++</code> → ${c}.`, { in: true });
        runs.push(i);
        i++; T.vars.i = i;
        T.push(5, `<code>i++</code> → <code>i = ${i}</code>. Move to the next box (the <code>while</code> moves <code>i</code> too, not just the <code>for</code>).`, { in: true });
      }
      const lone = c === 1, chk = [["count2 == 1", `${c} == 1 → ${lone}`, lone]];
      if (lone) { runs = runs.filter(k => k !== start); lonely = start; }
      T.push(7, lone ? `The run had just one 2 — it isn't next to another 2.` : c ? `The run had ${c} 2s, so they all have a 2 next to them.${i < n ? ` The <code>for</code> loop's <code>i++</code> will now skip <code>nums[${i}]</code>, which is safe because the <code>while</code> already saw it isn't a 2.` : ""}` : `No 2s here.`, { chk });
      if (lone) { T.ret(7, `<code>return false</code>.`, false, { chk }); return; }
    }
    delete T.vars.i; delete T.vars.count2; i = null;
    T.ret(10, `No lonely 2s. <code>return true</code>.`, true);
  }
});
</script>
</body>
</html>
