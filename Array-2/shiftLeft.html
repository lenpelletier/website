<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shiftLeft Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Victor+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tracer.css">
</head>
<body>
<main>
  <h1>shiftLeft: move everything left by one</h1>
  <p class="sub">Return an array that is "left shifted" by one, so <code>{6, 2, 5, 3}</code> gives <code>{2, 5, 3, 6}</code>. Step through <code>shiftLeft</code>: each box of the new array takes the value one box to the <em>right</em> in the original, and the first value wraps around to the end.</p>
  <div id="app"></div>
</main>
<script src="tracer.js"></script>
<script>
Tracer({
  name: "shiftLeft",
  code: [
    "public int[] shiftLeft(int[] nums) {",
    "  int[] a = new int[nums.length];",
    "",
    "  if (a.length == 0)",
    "    return a;",
    "  for (int i = 0; i < nums.length-1; i++) {",
    "    a[i] = nums[i+1];",
    "  }",
    "  a[a.length-1] = nums[0];",
    "",
    "  return a;",
    "}"
  ],
  inputs: [{ id: "nums", kind: "array", value: [6, 2, 5, 3], width: 240 }],
  presets: [[[6, 2, 5, 3]], [[1, 2]], [[1]], [[]], [[1, 1, 2, 2, 4]], [[1, 1, 1]], [[1, 2, 3]]],
  legend: [
    ["outer", "<code>a[i]</code>"],
    ["inner", "<code>nums[i+1]</code>"],
    ["match", "just copied"]
  ],
  trace([nums], T) {
    const n = nums.length;
    let a = null, i = null, fresh = -1, wrap = false;
    const w = Math.max(42, ...nums.map(x => String(x).length * 12 + 26));
    T.view = () => {
      const N = T.arr("nums", nums, w), list = [N];
      if (a) {
        const A = T.arr("a", a, w);
        if (i !== null) { A.top(i, `i=${i} ▼`); if (i < n - 1) { A.at(i, "outer"); N.at(i + 1, "inner").bot(i + 1, "▲ i+1"); } }
        if (wrap) { N.at(0, "inner").bot(0, "▲ 0"); A.at(n - 1, "outer").top(n - 1, "last ▼"); }
        if (fresh >= 0) A.at(fresh, "new");
        list.push(A);
      }
      return list;
    };
    T.vars.nums = nums;
    T.push(0, `Call <code>shiftLeft(${T.fmt(nums)})</code>.`);
    a = new Array(n).fill(0); T.vars.a = a;
    T.push(1, `<code>new int[${n}]</code> makes a new array the same length, all 0s.`);
    const empty = n === 0, c0 = ["a.length == 0", `${n} == 0 → ${empty}`, empty];
    if (empty) { T.push(3, `The array is empty, so there's nothing to shift.`, { chk: [c0] }); T.ret(4, `<code>return a</code> → <code>[]</code>.`, [], { chk: [c0] }); return; }
    T.push(3, `<code>${n} == 0</code> is <b>false</b>. (Without this check, <code>nums[0]</code> at the end would throw an exception for an empty array.)`, { chk: [c0] });
    for (i = 0; ; i++) {
      T.vars.i = i; fresh = -1;
      if (i >= n - 1) { T.push(5, `<code>i = ${i}</code>: <code>${i} &lt; ${n - 1}</code> is <b>false</b>. The last box of <code>a</code> has no box to its right to copy from.`); break; }
      T.push(5, `${i === 0 ? "Loop starts at" : "Loop:"} <code>i = ${i}</code>. <code>${i} &lt; ${n - 1}</code> is <b>true</b>.`);
      a[i] = nums[i + 1]; fresh = i; T.vars.a = a;
      T.push(6, `<code>a[${i}] = nums[${i + 1}]</code> → ${nums[i + 1]}.`);
    }
    delete T.vars.i; i = null; fresh = n - 1; wrap = true;
    a[n - 1] = nums[0]; T.vars.a = a;
    T.push(8, `<code>a[a.length-1] = nums[0]</code>: the first value wraps around to the last box → ${nums[0]}.`);
    wrap = false; fresh = -1;
    T.ret(10, `<code>return a</code> → <code>${T.fmt(a)}</code>.`, a.slice());
  }
});
</script>
</body>
</html>
