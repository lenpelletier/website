<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>left2 Tracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Victor+Mono:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tracer.css">
</head>
<body>
<main>
  <h1>left2: rotate left by 2</h1>
  <p class="sub">Given a string, return a "rotated left 2" version where the first 2 characters are moved to the end. The string length will be at least 2. Step through <code>left2</code>: cut the string into the front 2 and the rest, then glue them back together the other way round.</p>
  <div id="app"></div>
</main>
<script src="tracer.js"></script>
<script>
Tracer({
  name: "left2",
  code: [
    "public String left2(String str) {",
    "  String front = str.substring(0,2);",
    "  String rest = str.substring(2);",
    "  return rest + front;",
    "}"
  ],
  inputs: [{ id: "str", value: "Hello" }],
  chk: false,
  presets: [["Hello"], ["java"], ["Hi"], ["code"], ["cat"], ["12345"], ["Chocolate"], ["bricks"]],
  validate([str]) {
    if (str.length < 2) return `<code>str</code> needs at least 2 characters — <code>str.substring(0,2)</code> would throw an exception.`;
  },
  legend: [
    ["outer", "<code>front</code> = <code>str.substring(0,2)</code>"],
    ["inner", "<code>rest</code> = <code>str.substring(2)</code>"]
  ],
  trace([str], T) {
    const q = T.q, n = str.length, front = str.substring(0, 2), rest = str.substring(2);
    let stage = 0;
    T.view = () => {
      const s = T.strip("str", str), list = [s];
      if (stage >= 1) s.cls(0, 2, "win");
      if (stage >= 2) s.cls(2, n, "win2");
      if (stage === 1) s.cut(0, 2, "win");
      if (stage === 2) s.cut(2, n, "win2");
      if (stage >= 1) list.push(T.strip("front", front).cls(0, 2, stage === 1 ? "win new" : "win"));
      if (stage >= 2) list.push(T.strip("rest", rest).cls(0, rest.length, stage === 2 ? "win2 new" : "win2"));
      if (stage >= 3) list.push(T.cat(`rest + front = ${JSON.stringify(rest + front)}`, [[rest, "win2"], [front, "win"]]));
      return list;
    };
    T.vars.str = str;
    T.push(0, `Call <code>left2(${q(str)})</code>.`);
    stage = 1; T.vars.front = front;
    T.push(1, `<code>str.substring(0,2)</code> takes boxes 0 and 1 → <code>front = ${q(front)}</code>.`);
    stage = 2; T.vars.rest = rest;
    T.push(2, `<code>str.substring(2)</code> takes everything from index 2 to the end → <code>rest = ${q(rest)}</code>.${rest === "" ? " There's nothing after the first two, so it's empty." : ""}`);
    stage = 3;
    T.ret(3, `<code>rest + front</code> puts the front at the back → <code>${q(rest + front)}</code>.`, rest + front);
  }
});
</script>
</body>
</html>
